events {}

http {
    server_tokens off;

    # حماية بسيطة من محاولات تسجيل الدخول المتكررة (brute force)
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
    # حد عام أوسع لبقية الـ API (حماية من إساءة الاستخدام العامة)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;

    # مطلوب لدعم WebSocket (/ws/notifications)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream fastapi_app {
        server app:8000;
    }

    server {
        listen 80;
        server_name _;
        client_max_body_size 11m;

        # مطلوب لتفعيل HTTPS عبر Certbot (تحدّي webroot)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Health endpoint used by smoke checks/load balancers.
        location = /health {
            proxy_pass http://fastapi_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /auth/ {
            limit_req zone=auth_limit burst=3 nodelay;
            proxy_pass http://fastapi_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /ws/ {
            proxy_pass http://fastapi_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
        }

        location / {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://fastapi_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Basic browser-side hardening. HSTS is enabled only in HTTPS.
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        }
    }

    # HTTPS is intentionally not activated until the operator has a real
    # domain and a valid Let's Encrypt certificate. Use
    # nginx/nginx.production.example.conf as the production template.
}
