events {}

http {
    # حماية بسيطة من محاولات تسجيل الدخول المتكررة (brute force)
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
    # حد عام أوسع لبقية الـ API (حماية من إساءة الاستخدام العامة)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;

    # مطلوب لدعم WebSocket (/ws/notifications): يحدّد قيمة Connection حسب وجود
    # طلب ترقية (Upgrade) من عدمه — النمط الموصى به رسميًا من nginx لبروكسي WebSocket
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream fastapi_app {
        server app:8000;
    }

    server {
        listen 80;
        server_name _;
        client_max_body_size 11m;

        # مطلوب لتفعيل HTTPS عبر Certbot (تحدّي webroot) — راجع README لخطوات الحصول على الشهادة
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location /auth/ {
            limit_req zone=auth_limit burst=3 nodelay;
            proxy_pass http://fastapi_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # مسار WebSocket للإشعارات الفورية — لازم headers ترقية البروتوكول (Upgrade/Connection)
        # وإلا nginx بيتعامل معه كطلب HTTP عادي وتفشل مصافحة WebSocket بالكامل
        location /ws/ {
            proxy_pass http://fastapi_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            # اتصال WebSocket يضل مفتوح ومنتظر بين الرسائل — مهلة أطول من الطلبات العادية
            proxy_read_timeout 3600s;
        }

        location / {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://fastapi_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # فعّل هذا الجزء بعد ما تحصل على شهادة SSL (خطوات كاملة بـ README):
    # 1. استبدل your-domain.com بدومينك الحقيقي في السطرين أدناه
    # 2. شغّل: docker compose up -d nginx
    # 3. شغّل أمر الحصول على الشهادة لأول مرة (موجود بالـ README)
    # 4. ألغِ التعليق عن هذا الجزء بالكامل وأعد تشغيل nginx: docker compose restart nginx
    #
    # server {
    #     listen 443 ssl;
    #     server_name your-domain.com;
    #
    #     ssl_certificate /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    #     ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    #
    #     location /auth/ {
    #         limit_req zone=auth_limit burst=3 nodelay;
    #         proxy_pass http://fastapi_app;
    #         proxy_set_header Host $host;
    #         proxy_set_header X-Real-IP $remote_addr;
    #         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #         proxy_set_header X-Forwarded-Proto $scheme;
    #     }
    #
    #     location /ws/ {
    #         proxy_pass http://fastapi_app;
    #         proxy_http_version 1.1;
    #         proxy_set_header Upgrade $http_upgrade;
    #         proxy_set_header Connection $connection_upgrade;
    #         proxy_set_header Host $host;
    #         proxy_set_header X-Real-IP $remote_addr;
    #         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #         proxy_set_header X-Forwarded-Proto $scheme;
    #         proxy_read_timeout 3600s;
    #     }
    #
    #     location / {
    #         limit_req zone=api_limit burst=20 nodelay;
    #         proxy_pass http://fastapi_app;
    #         proxy_set_header Host $host;
    #         proxy_set_header X-Real-IP $remote_addr;
    #         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #         proxy_set_header X-Forwarded-Proto $scheme;
    #     }
