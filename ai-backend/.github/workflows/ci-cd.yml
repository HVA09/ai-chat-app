name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_backend_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: تثبيت المكتبات
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: تشغيل الاختبارات
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ai_backend_test
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ai_backend_test
          JWT_SECRET_KEY: test-secret-key-for-ci-only
          AI_API_KEY: test-key-not-real
        run: pytest -v

  build-and-push:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: تسجيل الدخول لـ GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: بناء الصورة ورفعها
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest

  deploy:
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      # تحتاج Secrets حقيقية في إعدادات الريبو (Settings → Secrets and variables → Actions):
      # SERVER_HOST, SERVER_USER, SSH_PRIVATE_KEY — بدونها هذه الخطوة لن تعمل.
      # أضفها بنفسك حسب السيرفر/الـ Cloud (AWS/Azure/GCP) اللي تستخدمه.
      - name: نشر عبر SSH على السيرفر
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/ai-backend
            docker compose pull
            docker compose up -d
