[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ai-chat-saas"
version = "0.1.0"
description = "Python SDK for the AI Chat SaaS Developer API v1."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "AI Chat SaaS"}]
dependencies = [
  "httpx>=0.27,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ai_chat_saas"]

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
