name: One-shot Backblaze B2 verification

on:
  push:
    branches:
      - main

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      B2_BUCKET: ${{ secrets.B2_BUCKET }}
      B2_ENDPOINT_URL: ${{ secrets.B2_ENDPOINT_URL }}
      B2_REGION: ${{ secrets.B2_REGION }}
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v6
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: python -m pip install -r ai-backend/requirements.txt

      - name: Run Backblaze B2 upload/read/delete smoke test
        id: smoke
        continue-on-error: true
        working-directory: ai-backend
        env:
          S3_BUCKET: ${{ env.B2_BUCKET }}
          S3_ENDPOINT_URL: ${{ env.B2_ENDPOINT_URL }}
          S3_REGION: ${{ env.B2_REGION }}
          S3_ACCESS_KEY_ID: ${{ env.B2_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ env.B2_APPLICATION_KEY }}
        run: python scripts/storage_smoke.py

      - name: Publish verification status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          STATE: ${{ steps.smoke.outcome == 'success' && 'success' || 'failure' }}
          DESCRIPTION: ${{ steps.smoke.outcome == 'success' && 'Backblaze B2 upload/read/delete smoke passed' || 'Backblaze B2 upload/read/delete smoke failed' }}
        run: |
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$SHA" \
            -d "$(python - <<'PY'
import json, os
print(json.dumps({
    "state": os.environ["STATE"],
    "target_url": os.environ.get("GITHUB_SERVER_URL", "") + "/" + os.environ["GITHUB_REPOSITORY"] + "/actions/runs/" + os.environ["GITHUB_RUN_ID"],
    "description": os.environ["DESCRIPTION"],
    "context": "backblaze-storage-smoke",
}))
PY
)"

      - name: Fail when verification failed
        if: steps.smoke.outcome != 'success'
        run: exit 1
