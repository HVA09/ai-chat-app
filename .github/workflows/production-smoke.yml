name: Production smoke

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "15 3 * * *"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BACKEND_URL: https://ai-chat-backend-ltxa.onrender.com
      FRONTEND_URL: https://ai-chat-frontend-v8ma.onrender.com
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run backend smoke test
        run: |
          chmod +x ai-backend/scripts/smoke.sh
          ai-backend/scripts/smoke.sh "$BACKEND_URL"

      - name: Check frontend is reachable
        run: |
          curl --fail --silent --show-error --location \
            --max-time 30 \
            --retry 3 \
            --retry-delay 5 \
            --retry-all-errors \
            --output /dev/null \
            --write-out 'Frontend HTTP %{http_code}\n' \
            "$FRONTEND_URL/"

      - name: Check backend health is reachable
        run: |
          curl --fail --silent --show-error --location \
            --max-time 30 \
            --retry 3 \
            --retry-delay 5 \
            --retry-all-errors \
            --output /dev/null \
            --write-out 'Backend health HTTP %{http_code}\n' \
            "$BACKEND_URL/health"
