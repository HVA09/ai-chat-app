name: Temporary Frontend Dependency Audit

on:
  push:
    branches:
      - security/frontend-audit

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ai-frontend/package.json
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Run npm audit
        run: npm audit --json || true
