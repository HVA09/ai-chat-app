name: Production database backup

on:
  push:
    branches: [main]
    paths: [".github/workflows/production-db-backup.yml"]
  workflow_dispatch:
  schedule:
    - cron: "45 2 * * *"

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      BACKUP_ENABLED: ${{ vars.PRODUCTION_BACKUP_ENABLED }}
      PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
      S3_REGION: ${{ secrets.S3_REGION }}
      S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      RENDER_POSTGRES_REGION: ohio
    steps:
      - name: Validate backup configuration presence
        shell: bash
        run: |
          if [[ "$BACKUP_ENABLED" != "true" ]]; then
            echo "PRODUCTION_BACKUP_ENABLED is not true; the real backup job will remain skipped."
            exit 0
          fi
          if [[ "${{ vars.PRODUCTION_DB_CREDENTIAL_ROTATED }}" != "true" ]]; then
            echo "PRODUCTION_DB_CREDENTIAL_ROTATED is not true; backup remains locked until DB credential rotation is completed."
            exit 0
          fi
          missing=0
          for name in PRODUCTION_DATABASE_URL S3_BUCKET S3_ENDPOINT_URL S3_REGION S3_ACCESS_KEY_ID S3_SECRET_ACCESS_KEY; do
            if [[ -z "${!name:-}" ]]; then
              echo "MISSING $name"
              missing=1
            else
              echo "PRESENT $name"
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi
          echo "Backup configuration is present."

  backup:
    if: vars.PRODUCTION_BACKUP_ENABLED == 'true' && vars.PRODUCTION_DB_CREDENTIAL_ROTATED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BACKUP_BUCKET: ${{ secrets.S3_BUCKET }}
      BACKUP_ENDPOINT: ${{ secrets.S3_ENDPOINT_URL }}
      BACKUP_REGION: ${{ secrets.S3_REGION }}
      AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      AWS_EC2_METADATA_DISABLED: "true"
      RENDER_POSTGRES_REGION: ohio
    steps:
      - name: Create backup directory
        run: mkdir -p "$RUNNER_TEMP/db-backup"

      - name: Dump production PostgreSQL
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          test -n "$DATABASE_URL"
          filename="ai-chat-postgres-$(date -u +%Y%m%dT%H%M%SZ).dump"
          BACKUP_DATABASE_URL="$(python3 - <<'PY'
          import os
          from urllib.parse import parse_qsl, urlencode, urlsplit, urlunsplit
          url = urlsplit(os.environ["DATABASE_URL"])
          host = url.hostname
          if not host:
              raise SystemExit("DATABASE_URL has no hostname")
          if host.endswith(".render.com"):
              external_host = host
          elif host.startswith("dpg-"):
              external_host = f"{host}.{os.environ['RENDER_POSTGRES_REGION']}-postgres.render.com"
          else:
              external_host = host
          query = dict(parse_qsl(url.query, keep_blank_values=True))
          query["sslmode"] = "require"
          netloc = host
          if url.username is not None:
              netloc = url.username
              if url.password is not None:
                  netloc += ":" + url.password
              netloc += "@"
          netloc += external_host
          if url.port:
              netloc += ":" + str(url.port)
          print(urlunsplit((url.scheme, netloc, url.path, urlencode(query), url.fragment)))
          PY
          )"
          test -n "$BACKUP_DATABASE_URL"
          docker run --rm \
            -e DATABASE_URL="$BACKUP_DATABASE_URL" \
            -v "$RUNNER_TEMP/db-backup:/backup" \
            postgres:18-alpine \
            sh -c 'pg_dump "$DATABASE_URL" --format=custom --file="/backup/$1"' sh "$filename"
          test -s "$RUNNER_TEMP/db-backup/$filename"
          echo "BACKUP_FILE=$filename" >> "$GITHUB_ENV"

      - name: Validate backup archive
        run: |
          docker run --rm -v "$RUNNER_TEMP/db-backup:/backup" postgres:18-alpine sh -c 'pg_restore --list "/backup/$1" >/dev/null' sh "$BACKUP_FILE"

      - name: Upload backup to object storage
        run: |
          test -n "$BACKUP_BUCKET"
          test -n "$BACKUP_ENDPOINT"
          test -n "$BACKUP_REGION"
          aws s3 cp "$RUNNER_TEMP/db-backup/$BACKUP_FILE" "s3://$BACKUP_BUCKET/database/$BACKUP_FILE" --endpoint-url "$BACKUP_ENDPOINT" --region "$BACKUP_REGION" --only-show-errors

      - name: Verify remote backup
        run: |
          aws s3api head-object --bucket "$BACKUP_BUCKET" --key "database/$BACKUP_FILE" --endpoint-url "$BACKUP_ENDPOINT" --region "$BACKUP_REGION" --query '{size:ContentLength,etag:ETag}' --output json

      - name: Remove local backup
        if: always()
        run: rm -rf "$RUNNER_TEMP/db-backup"
