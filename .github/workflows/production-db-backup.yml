name: Production database backup

on:
  push:
    branches: [main]
    paths: [".github/workflows/production-db-backup.yml"]
  workflow_dispatch:
  schedule:
    - cron: "45 2 * * *"

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      BACKUP_ENABLED: ${{ vars.PRODUCTION_BACKUP_ENABLED }}
      PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
      S3_REGION: ${{ secrets.S3_REGION }}
      S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      RENDER_POSTGRES_REGION: ohio
    steps:
      - name: Validate backup configuration presence
        shell: bash
        run: |
          if [[ "$BACKUP_ENABLED" != "true" ]]; then
            echo "PRODUCTION_BACKUP_ENABLED is not true; the real backup job will remain skipped."
            exit 0
          fi
          missing=0
          for name in PRODUCTION_DATABASE_URL S3_BUCKET S3_ENDPOINT_URL S3_REGION S3_ACCESS_KEY_ID S3_SECRET_ACCESS_KEY; do
            if [[ -z "${!name:-}" ]]; then
              echo "MISSING $name"
              missing=1
            else
              echo "PRESENT $name"
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi
          echo "Backup configuration is present."

  backup:
    if: vars.PRODUCTION_BACKUP_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BACKUP_BUCKET: ${{ secrets.B2_BUCKET }}
      BACKUP_ENDPOINT: ${{ secrets.B2_ENDPOINT_URL }}
      BACKUP_REGION: ${{ secrets.B2_REGION }}
      AWS_ACCESS_KEY_ID: ${{ secrets.B2_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - name: Create backup directory
        run: mkdir -p "$RUNNER_TEMP/db-backup"

      - name: Dump production PostgreSQL
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          test -n "$DATABASE_URL"
          filename="ai-chat-postgres-$(date -u +%Y%m%dT%H%M%SZ).dump"
          python3 - <<'PY'
          import os
          from urllib.parse import unquote, urlsplit
          url = urlsplit(os.environ["DATABASE_URL"])
          host = url.hostname
          if not host:
              raise SystemExit("DATABASE_URL has no hostname")
          external_host = f"{host}.{os.environ['RENDER_POSTGRES_REGION']}-postgres.render.com"
          values = {
              "PGHOST": external_host,
              "PGPORT": str(url.port or 5432),
              "PGUSER": unquote(url.username or ""),
              "PGPASSWORD": unquote(url.password or ""),
              "PGDATABASE": url.path.lstrip("/"),
              "PGSSLMODE": "require",
          }
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              for key, value in values.items():
                  env_file.write(f"{key}={value}\n")
          PY
          test -n "$PGHOST"
          docker run --rm \
            -e PGHOST \
            -e PGPORT \
            -e PGUSER \
            -e PGPASSWORD \
            -e PGDATABASE \
            -e PGSSLMODE \
            -v "$RUNNER_TEMP/db-backup:/backup" \
            postgres:18-alpine \
            sh -c 'pg_dump --format=custom --file="/backup/$1"' sh "$filename"
          test -s "$RUNNER_TEMP/db-backup/$filename"
          echo "BACKUP_FILE=$filename" >> "$GITHUB_ENV"

      - name: Validate backup archive
        run: |
          docker run --rm -v "$RUNNER_TEMP/db-backup:/backup" postgres:18-alpine sh -c 'pg_restore --list "/backup/$1" >/dev/null' sh "$BACKUP_FILE"

      - name: Upload backup to object storage
        run: |
          test -n "$BACKUP_BUCKET"
          test -n "$BACKUP_ENDPOINT"
          test -n "$BACKUP_REGION"
          aws s3 cp "$RUNNER_TEMP/db-backup/$BACKUP_FILE" "s3://$BACKUP_BUCKET/database/$BACKUP_FILE" --endpoint-url "$BACKUP_ENDPOINT" --region "$BACKUP_REGION" --only-show-errors

      - name: Verify remote backup
        run: |
          aws s3api head-object --bucket "$BACKUP_BUCKET" --key "database/$BACKUP_FILE" --endpoint-url "$BACKUP_ENDPOINT" --region "$BACKUP_REGION" --query '{size:ContentLength,etag:ETag}' --output json

      - name: Remove local backup
        if: always()
        run: rm -rf "$RUNNER_TEMP/db-backup"
