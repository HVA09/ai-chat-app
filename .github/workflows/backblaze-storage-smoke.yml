name: Backblaze B2 object storage smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  storage-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      B2_BUCKET: ${{ secrets.B2_BUCKET }}
      B2_ENDPOINT_URL: ${{ secrets.B2_ENDPOINT_URL }}
      B2_REGION: ${{ secrets.B2_REGION }}
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v6
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: python -m pip install -r ai-backend/requirements.txt

      - name: Run application storage adapter smoke test
        working-directory: ai-backend
        env:
          S3_BUCKET: ${{ env.B2_BUCKET }}
          S3_ENDPOINT_URL: ${{ env.B2_ENDPOINT_URL }}
          S3_REGION: ${{ env.B2_REGION }}
          S3_ACCESS_KEY_ID: ${{ env.B2_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ env.B2_APPLICATION_KEY }}
        run: python scripts/storage_smoke.py
