name: Keep pull request branches current

on:
  # Only run the write-capable push workflow from the trusted default branch.
  # Updated PR branches are handled by pull_request_target or explicit dispatch.
  push:
    branches: [main]
  # Also check newly opened or updated PRs, including stacked PR dependencies.
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  # API branch updates made with GITHUB_TOKEN do not reliably fan out push events.
  # Dispatch this workflow explicitly to refresh PRs stacked on an updated PR branch.
  workflow_dispatch:
    inputs:
      base_ref:
        description: Repository branch whose dependent PRs should be refreshed
        required: true
        type: string

concurrency:
  group: branch-sync-${{ github.event.pull_request.number || inputs.base_ref || github.ref }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  synchronize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Update PR branches that are behind their base
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref || inputs.base_ref || github.ref_name }}
          EVENT_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || '' }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request_target" ]]; then
            if [[ "$EVENT_HEAD_REPOSITORY" != "$REPOSITORY" ]]; then
              echo "Skipping fork PR; no write access to its head branch."
              exit 0
            fi
            pr_numbers=("$EVENT_PR_NUMBER")
          else
            mapfile -t pr_numbers < <(gh api --paginate --method GET \
              "repos/$REPOSITORY/pulls" \
              -f state=open -f base="$EVENT_BASE_REF" -f per_page=100 \
              --jq '.[].number')
          fi

          for pr_number in "${pr_numbers[@]}"; do
            [[ -n "$pr_number" ]] || continue
            pr_json=$(gh api "repos/$REPOSITORY/pulls/$pr_number")
            base_ref=$(jq -r '.base.ref' <<<"$pr_json")
            head_repo=$(jq -r '.head.repo.full_name // ""' <<<"$pr_json")
            head_ref=$(jq -r '.head.ref' <<<"$pr_json")
            head_sha=$(jq -r '.head.sha' <<<"$pr_json")
            base_sha=$(jq -r '.base.sha' <<<"$pr_json")

            [[ "$base_ref" == "$EVENT_BASE_REF" ]] || continue
            [[ "$head_repo" == "$REPOSITORY" ]] || continue

            comparison=$(gh api "repos/$REPOSITORY/compare/$head_sha...$base_sha" --jq '.status')
            if [[ "$comparison" != "ahead" && "$comparison" != "diverged" ]]; then
              echo "PR #$pr_number is current relative to $base_ref ($comparison)."
              continue
            fi

            echo "Updating PR #$pr_number ($head_ref) from base $base_ref."
            if ! gh api --method PUT "repos/$REPOSITORY/pulls/$pr_number/update-branch" \
              -f expected_head_sha="$head_sha"; then
              echo "::warning::Could not automatically update PR #$pr_number; likely conflict or a concurrent head update. Manual resolution is required."
              continue
            fi

            updated_sha="$head_sha"
            for attempt in {1..20}; do
              updated_sha=$(gh api "repos/$REPOSITORY/pulls/$pr_number" --jq '.head.sha')
              [[ "$updated_sha" != "$head_sha" ]] && break
              sleep 2
            done

            if [[ "$updated_sha" == "$head_sha" ]]; then
              echo "::warning::PR #$pr_number update was accepted but the new head SHA was not observed in time; CI dispatch skipped."
              continue
            fi

            # GITHUB_TOKEN-created pushes do not start pull_request workflows.
            # Dispatch required checks explicitly against the updated head ref.
            gh workflow run ci.yml --repo "$REPOSITORY" --ref "$head_ref"
            gh workflow run codeql.yml --repo "$REPOSITORY" --ref "$head_ref"

            # Explicitly cascade to PRs whose base is this newly updated branch.
            # This avoids depending on a push event that GITHUB_TOKEN may suppress.
            gh workflow run branch-sync.yml --repo "$REPOSITORY" --ref main \
              -f base_ref="$head_ref"
            echo "Updated PR #$pr_number to $updated_sha; dispatched CI, CodeQL, and dependent-branch synchronization."
          done
