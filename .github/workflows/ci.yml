name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_backend_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ai_backend_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    defaults:
      run:
        working-directory: ai-backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m compileall -q app
      - run: alembic upgrade head
        env:
          ENVIRONMENT: test
          DEBUG: "false"
          TEST_DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/ai_backend_test"
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/ai_backend_test"
          JWT_SECRET_KEY: test-only-secret-change-in-ci
          AI_API_KEY: test-key
          CORS_ORIGINS: '["http://localhost:5173"]'
          REDIS_URL: "redis://localhost:6379/0"
          CELERY_BROKER_URL: "redis://localhost:6379/1"
          CELERY_RESULT_BACKEND: "redis://localhost:6379/1"
      - run: pytest -q
        env:
          ENVIRONMENT: test
          DEBUG: "false"
          TEST_DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/ai_backend_test"
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/ai_backend_test"
          JWT_SECRET_KEY: test-only-secret-change-in-ci
          AI_API_KEY: test-key
          CORS_ORIGINS: '["http://localhost:5173"]'
          REDIS_URL: "redis://localhost:6379/0"
          CELERY_BROKER_URL: "redis://localhost:6379/1"
          CELERY_RESULT_BACKEND: "redis://localhost:6379/1"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm install
      - run: npm test
      - run: npm run build
