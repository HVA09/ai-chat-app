name: Playwright E2E

on:
  pull_request:
    paths:
      - "ai-frontend/**"
      - ".github/workflows/playwright-e2e.yml"
  workflow_dispatch:

concurrency:
  group: playwright-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ai-frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install frontend dependencies
        run: npm install --prefer-online --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run isolated browser smoke tests
        run: npm run test:e2e
        env:
          CI: "true"
      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            ai-frontend/playwright-report/
            ai-frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7
