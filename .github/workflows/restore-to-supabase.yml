name: Restore production backup to Supabase

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BACKUP_BUCKET: ${{ secrets.S3_BUCKET }}
      BACKUP_ENDPOINT: ${{ secrets.S3_ENDPOINT_URL }}
      BACKUP_REGION: ${{ secrets.S3_REGION }}
      AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      AWS_EC2_METADATA_DISABLED: "true"
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

    steps:
      - name: Verify required secrets are present
        shell: bash
        run: |
          set -euo pipefail
          for name in BACKUP_BUCKET BACKUP_ENDPOINT BACKUP_REGION AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY SUPABASE_DB_URL; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required secret/config: $name"
              exit 1
            fi
          done

      - name: Find newest existing production backup
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          import subprocess
          import sys

          cmd = [
              "aws", "s3api", "list-objects-v2",
              "--bucket", os.environ["BACKUP_BUCKET"],
              "--prefix", "database/",
              "--endpoint-url", os.environ["BACKUP_ENDPOINT"],
              "--region", os.environ["BACKUP_REGION"],
              "--output", "json",
          ]
          result = subprocess.run(cmd, check=True, text=True, capture_output=True)
          payload = json.loads(result.stdout or "{}")
          objects = [
              item for item in payload.get("Contents", [])
              if item.get("Key", "").endswith(".dump")
          ]
          objects.sort(key=lambda x: x.get("LastModified", ""), reverse=True)

          for item in objects:
              key = item["Key"]
              check = subprocess.run(
                  [
                      "aws", "s3api", "head-object",
                      "--bucket", os.environ["BACKUP_BUCKET"],
                      "--key", key,
                      "--endpoint-url", os.environ["BACKUP_ENDPOINT"],
                      "--region", os.environ["BACKUP_REGION"],
                  ],
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
              )
              if check.returncode == 0:
                  with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
                      f.write(f"BACKUP_KEY={key}\n")
                  print(f"Selected newest existing backup: {key}")
                  sys.exit(0)

          raise SystemExit("No existing .dump backup was found in object storage.")
          PY

      - name: Download backup
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/db-backup"
          aws s3 cp             "s3://$BACKUP_BUCKET/$BACKUP_KEY"             "$RUNNER_TEMP/db-backup/production.dump"             --endpoint-url "$BACKUP_ENDPOINT"             --region "$BACKUP_REGION"             --only-show-errors
          test -s "$RUNNER_TEMP/db-backup/production.dump"

      - name: Validate backup archive
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm             -v "$RUNNER_TEMP/db-backup:/backup"             postgres:18-alpine             sh -c 'pg_restore --list /backup/production.dump >/dev/null'

      - name: Restore public schema to Supabase
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm             -e SUPABASE_DB_URL="$SUPABASE_DB_URL"             -v "$RUNNER_TEMP/db-backup:/backup"             postgres:18-alpine             sh -c '
              pg_restore                 --exit-on-error                 --clean                 --if-exists                 --no-owner                 --no-privileges                 --schema=public                 --dbname="$SUPABASE_DB_URL"                 /backup/production.dump
            '

      - name: Verify Supabase connectivity
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm             -e SUPABASE_DB_URL="$SUPABASE_DB_URL"             postgres:18-alpine             sh -c '
              psql                 "$SUPABASE_DB_URL"                 -Atc "select version()"
            '
