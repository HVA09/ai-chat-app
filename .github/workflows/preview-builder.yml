name: Preview Builder

on:
  pull_request:
    paths:
      - "preview-builder/**"
      - ".github/workflows/preview-builder.yml"
  push:
    branches:
      - main
    paths:
      - "preview-builder/**"
      - ".github/workflows/preview-builder.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: preview-builder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m compileall -q .
      - run: pytest -q
      - run: docker build -t ai-chat-preview-builder:test .
